name: Publicar GestPyme en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir -p _site/assets
          cp index.html config.js favicon.svg _site/
          cp -R assets/css assets/js _site/assets/
          touch _site/.nojekyll
      - name: Cargar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
